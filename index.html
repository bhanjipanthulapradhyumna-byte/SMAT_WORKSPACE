<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMAT Workspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="logo">S</div>
    <div><h1>SMAT</h1><span>Scientific MATLAB Workspace</span></div>
  </div>
  <div class="actions">
    <button id="newBtn">New</button>
    <button id="saveBtn">Save</button>
    <button id="saveAsBtn">Save As</button>
    <button id="runBtn" class="run">▶ Run</button>
    <button id="clearBtn">Clear</button>
  </div>
</header>
<main class="workspace">
<section class="editorPanel">
  <div class="panelHeader">
    <div><span>Current file</span><input id="filename" value="untitled.m"></div>
    <span id="status" class="status">Ready</span>
  </div>
  <div class="editor">
    <div id="lineNumbers" class="lineNumbers">1</div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">% SMAT MATLAB workspace

x = 4;
y = 8;
z = x + y;
disp(z);</textarea>
  </div>
</section>
<section class="outputPanel">
  <div class="panelHeader">
    <div><strong>Execution Output</strong><span>Command Window</span></div>
    <span id="executionState" class="status">Idle</span>
  </div>
  <pre id="output"></pre>
</section>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
